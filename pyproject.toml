[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zefiro"
version = "0.1.0"
description = "Progettazione e ottimizzazione del combustore Zefiro (GPL / aria compressa)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "cantera>=3.0",
    "build123d>=0.9",
    "pyyaml>=6.0",
    "CoolProp>=6.4",
    "pyarrow>=14",
    "scipy>=1.11",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
l1  = ["gmsh>=4.11"]
# pyarrow e' richiesto dal database dei campi di parete

opt = ["pymoo>=0.6", "openmdao>=3.30", "botorch>=0.11"]
# topopt usa solo numpy e scipy, gia' nelle dipendenze di base
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
zefiro-geometry = "zefiro.cli:main_geometry"
zefiro-l0       = "zefiro.cli:main_l0"
zefiro-web      = "zefiro.web.server:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: test che richiede piu' di ~5 s",
    "needs_mechanism: richiede il meccanismo cinetico esterno (scripts/fetch_mechanism.py)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
